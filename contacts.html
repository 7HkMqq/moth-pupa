<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moth pupa | Контакты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Moth pupa</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="about.html">О нас</a>
            <a href="contacts.html">Контакты</a>
        </nav>
    </header>

    <main>
        <section class="contacts-section">
            <h2>Свяжитесь с нами</h2>
            <p class="contacts-text">Оставьте заявку, и мы свяжемся с вами в ближайшее время для уточнения деталей заказа.</p>

            <!-- Форма обратной связи (Пункт 8 из задания) -->
            <div class="form-container">
                <form action="#" method="POST" class="contact-form">
                    
                    <div class="form-group">
                        <label for="name">Ваше имя:</label>
                        <input type="text" id="name" name="name" placeholder="Введите имя" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Ваш Email:</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Сообщение:</label>
                        <textarea id="message" name="message" rows="5" placeholder="Напишите, что вас интересует..." required></textarea>
                    </div>

                    <button type="submit" class="btn submit-btn">Отправить заявку</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Moth pupa. Все права защищены.</p>
    </footer>
</body>
</html>
